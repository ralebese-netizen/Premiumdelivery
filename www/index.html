<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bofelo Driver</title>
    <script>
      window.addEventListener('DOMContentLoaded', async () => {
          if (!window.Capacitor || !window.Capacitor.isNativePlatform()) return;
          try {
              const Plugins = window.Capacitor.Plugins;
              
              if (Plugins && Plugins.PushNotifications) {
                  let perm = await Plugins.PushNotifications.checkPermissions();
                  if (perm.receive !== 'granted') {
                      perm = await Plugins.PushNotifications.requestPermissions();
                  }
                  if (perm.receive === 'granted') {
                      await Plugins.PushNotifications.register();
                      Plugins.PushNotifications.addListener('registration', (token) => {
                          localStorage.setItem('nativeFcmToken', token.value);
                      });
                  }
              }

              if (Plugins && Plugins.Geolocation) {
                  let gps = await Plugins.Geolocation.checkPermissions();
                  if (gps.location !== 'granted') {
                      await Plugins.Geolocation.requestPermissions();
                  }
              }
          } catch (e) {
              console.error("Native permission error:", e);
          }
      });
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
</body>
</html>
